<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🍃 CWWRC · Endless Leaf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            overflow: hidden;
        }
        #game-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #2a1f3d;
            border-radius: 2rem 2rem 1.5rem 1.5rem;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6);
            padding: 0.8rem 0.8rem 1.2rem;
            touch-action: none;
            position: relative;
            border: 2px solid #6b4c8a;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a2e;
            padding: 0.5rem 1rem;
            border-radius: 3rem;
            margin-bottom: 0.8rem;
            color: #f0e6ff;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
            border: 2px solid #8b6bb0;
        }
        #hud .hud-item {
            background: #2a1f3d;
            padding: 0.2rem 0.8rem;
            border-radius: 2rem;
            box-shadow: 0 2px 0 #1a1a2e;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid #8b6bb0;
        }
        #timer-display {
            background: #2a1f3d;
            color: #ffd6e0;
            min-width: 4rem;
            justify-content: center;
            border-color: #ff8fab;
            display: none;  /* timer hidden – endless */
        }
        #canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            touch-action: none;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow: inset 0 0 0 3px #6b4c8a, 0 8px 15px rgba(0,0,0,0.5);
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #3a2a4a, #1a1a2e);
            touch-action: none;
            cursor: pointer;
        }
        #knob {
            position: absolute;
            width: 12%;
            aspect-ratio: 1 / 1;
            background: radial-gradient(circle at 35% 35%, #ff6b9d, #d43f7a);
            border-radius: 50%;
            box-shadow: 0 5px 0 #7a2a4a, 0 8px 25px rgba(0,0,0,0.6);
            border: 3px solid #ffb3c6;
            pointer-events: none;
            z-index: 10;
            transform: translate(-50%, -50%);
            will-change: transform;
            transition: none;
            top: 50%;
            left: 50%;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 30, 0.88);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #f0e6ff;
            border-radius: 1.8rem;
            padding: 1.5rem;
            text-align: center;
            z-index: 20;
            pointer-events: auto;
            transition: opacity 0.3s ease;
            border: 3px solid #8b6bb0;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #overlay h1 {
            font-size: 2.8rem;
            text-shadow: 0 6px 0 #1a1a2e;
            margin-bottom: 0.1rem;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff6b9d, #ffb347, #6bcbff, #d47bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #overlay h2 {
            font-size: 2rem;
            margin: 0.3rem 0 0.1rem;
            color: #ffb3c6;
        }
        #overlay p {
            font-size: 1.1rem;
            margin: 0.3rem 0 0.8rem;
            opacity: 0.9;
            color: #d4b0ff;
        }
        #main-action-btn {
            background: linear-gradient(135deg, #ff6b9d, #ffb347, #6bcbff, #d47bff);
            border: 3px solid #f0e6ff;
            color: #1a1a2e;
            font-weight: 800;
            font-size: 1.6rem;
            padding: 0.7rem 2.5rem;
            border-radius: 4rem;
            box-shadow: 0 6px 0 #3a2a4a, 0 6px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            margin-top: 0.5rem;
            letter-spacing: 1px;
            touch-action: manipulation;
            transition: 0.07s ease;
            display: inline-block;
        }
        #main-action-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #3a2a4a;
        }
        #final-score {
            background: #1a1a2e;
            padding: 0.2rem 1.8rem;
            border-radius: 3rem;
            font-size: 2rem;
            display: inline-block;
            margin: 0.2rem 0;
            border: 2px solid #ffb347;
            color: #ffb3c6;
        }
        .sub-text {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            opacity: 0.6;
            color: #8b6bb0;
        }
        @media (max-width: 420px) {
            #hud { font-size: 0.85rem; padding: 0.4rem 0.7rem; }
            #overlay h1 { font-size: 2.2rem; }
            #overlay h2 { font-size: 1.6rem; }
            #main-action-btn { font-size: 1.3rem; padding: 0.5rem 1.8rem; }
            #knob { width: 14%; }
        }
        @media (min-width: 600px) {
            #game-wrapper { max-width: 500px; }
            #overlay h1 { font-size: 3.5rem; }
            #main-action-btn { font-size: 2rem; padding: 0.8rem 3rem; }
        }
    </style>
</head>
<body>
<div id="game-wrapper">
    <div id="hud">
        <span class="hud-item">🍂 <span id="score-display">0</span></span>
        <span class="hud-item">🌟 Lv.<span id="level-display">1</span></span>
        <span class="hud-item" id="timer-display">⏳ ∞</span>
    </div>
    <div id="canvas-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="knob"></div>
        <div id="overlay">
            <h1>🍃 CWWRC</h1>
            <h2>Endless Leaf</h2>
            <p>🌈 catch colorful leaves · move the knob</p>
            <button id="main-action-btn">▶ PLAY</button>
            <div class="sub-text">∞ endless · no timer</div>
        </div>
    </div>
</div>
<script>
    (function() {
        "use strict";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const mainBtn = document.getElementById('main-action-btn');
        const scoreSpan = document.getElementById('score-display');
        const levelSpan = document.getElementById('level-display');
        const timerSpan = document.getElementById('timer-display');
        const knob = document.getElementById('knob');

        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let gameState = STATE.MENU;
        let score = 0;
        let level = 1;
        // timer removed – endless

        let playerX = 0.5;
        let playerY = 0.5;
        let targetX = 0.5;
        let targetY = 0.5;

        let leaves = [];
        const MAX_LEAVES = 40;
        let spawnCounter = 0;
        const SPAWN_RATE = 22;

        const LEAF_EMOJIS = [
            '🍂', '🍁', '🌸', '🌺', '🌻', 
            '🌷', '🌹', '💐', '🌼', '🌾',
            '🌸', '🌺', '🌻', '🌷', '🌹',
            '💐', '🌼', '🌸', '🌺', '🌻'
        ];
        const COLORS = [
            '#FF6B6B', '#FF9F43', '#FECA57', '#54A0FF', '#5F27CD',
            '#FF6B9D', '#FF9F43', '#FECA57', '#54A0FF', '#A29BFE'
        ];

        let animationId = null;
        let frameCount = 0;

        function getNormalizedCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = 600 / rect.width;
            const scaleY = 600 / rect.height;
            let x = (clientX - rect.left) * scaleX;
            let y = (clientY - rect.top) * scaleY;
            x = Math.min(600, Math.max(0, x));
            y = Math.min(600, Math.max(0, y));
            return { x: x / 600, y: y / 600 };
        }

        function updateKnobPosition() {
            const SMOOTH = 0.22;
            playerX += (targetX - playerX) * SMOOTH;
            playerY += (targetY - playerY) * SMOOTH;
            knob.style.left = (playerX * 100) + '%';
            knob.style.top = (playerY * 100) + '%';
        }

        class Leaf {
            constructor(x, y, speed, size, emoji, color) {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.size = size;
                this.emoji = emoji || LEAF_EMOJIS[Math.floor(Math.random() * LEAF_EMOJIS.length)];
                this.color = color || COLORS[Math.floor(Math.random() * COLORS.length)];
                this.rotation = Math.random() * 6.28;
                this.rotSpeed = (Math.random() - 0.5) * 0.05;
                this.alive = true;
                this.drift = (Math.random() - 0.5) * 0.004;
                this.glowSize = 0;
            }
            update() {
                this.y += this.speed;
                this.x += this.drift + Math.sin(this.y * 25) * 0.0015;
                if (this.x < -0.1) this.x = 1.1;
                if (this.x > 1.1) this.x = -0.1;
                this.rotation += this.rotSpeed;
                this.glowSize = 15 + Math.sin(this.y * 20) * 8;
                if (this.y > 1.2) this.alive = false;
            }
            draw(ctx) {
                const cx = this.x * 600;
                const cy = this.y * 600;
                const sizePx = this.size * 600;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(this.rotation);
                ctx.shadowColor = this.color + '80';
                ctx.shadowBlur = this.glowSize;
                ctx.font = `${sizePx * 1.4}px "Segoe UI Emoji", "Apple Color Emoji", system-ui, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 25;
                ctx.fillText(this.emoji, 0, 0);
                ctx.shadowBlur = 40;
                ctx.globalAlpha = 0.3;
                ctx.fillText(this.emoji, 0, 0);
                ctx.globalAlpha = 1;
                ctx.restore();
            }
            collidesWith(px, py, knobRadius) {
                const dx = this.x - px;
                const dy = this.y - py;
                return Math.sqrt(dx*dx + dy*dy) < (this.size + knobRadius);
            }
        }

        function spawnLeaf() {
            const size = 0.05 + Math.random() * 0.06;
            const speed = 0.004 + Math.random() * 0.014 + (level * 0.001);
            const emoji = LEAF_EMOJIS[Math.floor(Math.random() * LEAF_EMOJIS.length)];
            const color = COLORS[Math.floor(Math.random() * COLORS.length)];
            leaves.push(new Leaf(
                Math.random(),
                -0.1 - Math.random() * 0.2,
                speed,
                size,
                emoji,
                color
            ));
        }

        function updateHUD() {
            scoreSpan.textContent = score;
            levelSpan.textContent = level;
            timerSpan.textContent = '⏳ ∞';
        }

        function resetGame() {
            score = 0;
            level = 1;
            leaves = [];
            spawnCounter = 0;
            frameCount = 0;
            playerX = 0.5;
            playerY = 0.5;
            targetX = 0.5;
            targetY = 0.5;
            updateKnobPosition();
            updateHUD();
            overlay.classList.remove('hidden');
            mainBtn.textContent = '▶ PLAY';
            gameState = STATE.MENU;
        }

        function startGame() {
            resetGame();
            overlay.classList.add('hidden');
            gameState = STATE.PLAYING;
            mainBtn.textContent = '↻ RESTART';
            updateHUD();
        }

        function processCollisions() {
            const knobRadius = 0.07;
            for (let i = leaves.length - 1; i >= 0; i--) {
                const leaf = leaves[i];
                if (!leaf.alive) continue;
                if (leaf.collidesWith(playerX, playerY, knobRadius)) {
                    leaf.alive = false;
                    score++;
                    const newLevel = Math.floor(score / 8) + 1;
                    if (newLevel > level) level = newLevel;
                    updateHUD();
                    leaves.splice(i, 1);
                }
            }
        }

        function drawScene() {
            ctx.clearRect(0, 0, 600, 600);
            for (const leaf of leaves) {
                leaf.draw(ctx);
            }
            const px = playerX * 600;
            const py = playerY * 600;
            const gradient = ctx.createRadialGradient(px, py, 5, px, py, 50);
            gradient.addColorStop(0, 'rgba(255, 107, 157, 0.3)');
            gradient.addColorStop(0.5, 'rgba(255, 107, 157, 0.1)');
            gradient.addColorStop(1, 'rgba(255, 107, 157, 0)');
            ctx.beginPath();
            ctx.arc(px, py, 50, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(px, py, 22, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 200, 200, 0.5)';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#ff6b9d';
            ctx.shadowBlur = 20;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            if (gameState === STATE.PLAYING) {
                frameCount++;
                spawnCounter++;
                if (spawnCounter >= SPAWN_RATE) {
                    spawnCounter = 0;
                    if (leaves.length < MAX_LEAVES) {
                        spawnLeaf();
                        if (Math.random() < 0.3 && leaves.length < MAX_LEAVES - 2) {
                            spawnLeaf();
                        }
                    }
                }
                for (let i = leaves.length - 1; i >= 0; i--) {
                    leaves[i].update();
                    if (!leaves[i].alive) leaves.splice(i, 1);
                }
                processCollisions();
                updateKnobPosition();
                drawScene();
                animationId = requestAnimationFrame(gameLoop);
            } else {
                drawScene();
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        function handlePointerMove(e) {
            if (gameState !== STATE.PLAYING) return;
            e.preventDefault();
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const norm = getNormalizedCoords(clientX, clientY);
            targetX = norm.x;
            targetY = norm.y;
        }

        function handlePointerStart(e) {
            if (gameState !== STATE.PLAYING) return;
            e.preventDefault();
            handlePointerMove(e);
        }

        canvas.addEventListener('touchstart', handlePointerStart, { passive: false });
        canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
        canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('mousedown', handlePointerStart);
        canvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) handlePointerMove(e); });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        mainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (gameState === STATE.MENU || gameState === STATE.GAMEOVER) {
                resetGame();
                startGame();
            } else {
                resetGame();
                startGame();
            }
        });

        resetGame();
        updateKnobPosition();
        gameLoop();

        console.log('🍃 CWWRC Endless Leaf – timer removed!');
    })();
</script>
</body>
</html>
